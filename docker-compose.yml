version: '3.9'

services:
  chirm:
    build: .
    image: chirm:latest
    container_name: chirm
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"           # HTTP  — change left port to expose differently, e.g. "80:8080"
      - "8443:8443"           # HTTPS — self-signed CA or custom cert
    volumes:
      - chirm-data:/data      # Persistent SQLite DB + uploaded files
      - ./certs:/app/certs    # TLS certs (auto-generated on first run, or supply your own)
    environment:
      PORT: "8080"
      HTTPS_PORT: "8443"
      DATA_DIR: "/data"
      JWT_SECRET: "${JWT_SECRET:-change-me-use-a-long-random-string}"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/setup/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  chirm-data:
    driver: local

